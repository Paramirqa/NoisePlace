openapi: 3.1.0

info:
  title: NoisePlace API
  version: 1.0.0
  description: |
    REST API for the NoisePlace music platform.

    The API provides endpoints for user authentication, artists, releases,
    personal library, ratings, and private notes.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
    description: Service health and readiness
  - name: Authentication
    description: User registration and login
  - name: Users
    description: Current user
  - name: Artists
    description: Artist catalog
  - name: Releases
    description: Release catalog
  - name: Release artists
    description: Artists associated with releases
  - name: Ratings
    description: Public rating statistics and personal ratings
  - name: Library
    description: Personal music library
  - name: Notes
    description: Private user notes

security:
  - BearerAuth: []

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check service health
      operationId: healthCheck
      security: []
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /readyz:
    get:
      tags: [Health]
      summary: Check service readiness
      description: Checks database connectivity.
      operationId: readinessCheck
      security: []
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ready
        "503":
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: not_ready

  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              username: music_user
              email: user@example.com
              password: "StrongPassword123!"
      responses:
        "201":
          description: User successfully registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Username or email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a user
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: user@example.com
              password: "StrongPassword123!"
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    /api/v1/artists:
    get:
      tags: [Artists]
      summary: Search artists
      operationId: searchArtists
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching artists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Artist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Artists]
      summary: Create an artist
      operationId: createArtist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistRequest"
      responses:
        "201":
          description: Artist created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/artists/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:/api/v1/artists:
      tags: [Artists]
      summary: Get an artist
      operationId: getArtist
      security: []
      responses:
        "200":
          description: Artist details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Artists]
      summary: Update an artist
      operationId: updateArtist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtistRequest"
      responses:
        "200":
          description: Artist updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Artist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/artists/{artistID}/rating:
    parameters:
      - $ref: "#/components/parameters/ArtistID"
    get:
      tags: [Ratings]
      summary: Get public artist rating statistics
      operationId: getArtistRatingStats
      security: []
      responses:
        "200":
          description: Artist rating statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/releases:
    get:
      tags: [Releases]
      summary: Search releases
      operationId: searchReleases
      security: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Matching releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Release"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Releases]
      summary: Create a release
      operationId: createRelease
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseCreateRequest"
      responses:
        "201":
          description: Release created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWithArtists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Conflicting record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/releases/{id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [Releases]
      summary: Get a release
      operationId: getRelease
      security: []
      responses:
        "200":
          description: Release details including associated artists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWithArtists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags: [Releases]
      summary: Update a release
      operationId: updateRelease
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseUpdateRequest"
      responses:
        "200":
          description: Release updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReleaseWithArtists"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Releases]
      summary: Delete a release
      operationId: deleteRelease
      security: []
      responses:
        "204":
          description: Release deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/releases/{releaseID}/rating:
    parameters:
      - $ref: "#/components/parameters/ReleaseID"
    get:
      tags: [Ratings]
      summary: Get public release rating statistics
      operationId: getReleaseRatingStats
      security: []
      responses:
        "200":
          description: Release rating statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingStats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/releases/{id}/artists:
    parameters:
      - $ref: "#/components/parameters/PathID"
    get:
      tags: [Release artists]
      summary: List artists associated with a release
      operationId: listReleaseArtists
      security: []
      responses:
        "200":
          description: Associated artists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseArtist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags: [Release artists]
      summary: Add an artist to a release
      operationId: addReleaseArtist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseArtistCreateRequest"
      responses:
        "201":
          description: Updated list of associated artists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseArtist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release or artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Artist is already linked to this release
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/releases/{id}/artists/{artist_id}:
    parameters:
      - $ref: "#/components/parameters/PathID"
      - $ref: "#/components/parameters/ReleaseArtistID"
    put:
      tags: [Release artists]
      summary: Update an artist association
      operationId: updateReleaseArtist
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseArtistUpdateRequest"
      responses:
        "200":
          description: Updated list of associated artists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReleaseArtist"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release, artist, or association not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags: [Release artists]
      summary: Remove an artist from a release
      operationId: removeReleaseArtist
      security: []
      responses:
        "204":
          description: Artist association removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: Release, artist, or association not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/library/artists:
    get:
      tags: [Library]
      summary: List artists in the current user's library
      operationId: listLibraryArtists
      responses:
        "200":
          description: User's artists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryArtist"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/library/artists/{artistID}:
    parameters:
      - $ref: "#/components/parameters/ArtistID"
    post:
      tags: [Library]
      summary: Add an artist to the current user's library
      operationId: addArtistToLibrary
      responses:
        "204":
          description: Artist added to library
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Library]
      summary: Remove an artist from the current user's library
      operationId: removeArtistFromLibrary
      responses:
        "204":
          description: Artist removed from library
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist is not in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/library/releases:
    get:
      tags: [Library]
      summary: List releases in the current user's library
      operationId: listLibraryReleases
      responses:
        "200":
          description: User's releases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryRelease"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/library/releases/{releaseID}:
    parameters:
      - $ref: "#/components/parameters/ReleaseID"
    post:
      tags: [Library]
      summary: Add a release to the current user's library
      operationId: addReleaseToLibrary
      responses:
        "204":
          description: Release added to library
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Library]
      summary: Remove a release from the current user's library
      operationId: removeReleaseFromLibrary
      responses:
        "204":
          description: Release removed from library
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release is not in the library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/ratings/artists/{artistID}:
    parameters:
      - $ref: "#/components/parameters/ArtistID"
    get:
      tags: [Ratings]
      summary: Get the current user's artist rating
      operationId: getArtistRating
      responses:
        "200":
          description: Personal artist rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArtistRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist rating not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Ratings]
      summary: Create or update the current user's artist rating
      operationId: upsertArtistRating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArtistRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Ratings]
      summary: Delete the current user's artist rating
      operationId: deleteArtistRating
      responses:
        "204":
          description: Rating deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist rating not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/ratings/releases/{releaseID}:
    parameters:
      - $ref: "#/components/parameters/ReleaseID"
    get:
      tags: [Ratings]
      summary: Get the current user's release rating
      operationId: getReleaseRating
      responses:
        "200":
          description: Personal release rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserReleaseRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release rating not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Ratings]
      summary: Create or update the current user's release rating
      operationId: upsertReleaseRating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
      responses:
        "200":
          description: Rating saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserReleaseRating"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Ratings]
      summary: Delete the current user's release rating
      operationId: deleteReleaseRating
      responses:
        "204":
          description: Rating deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release rating not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/notes/artists/{artistID}:
    parameters:
      - $ref: "#/components/parameters/ArtistID"
    get:
      tags: [Notes]
      summary: Get a personal note about an artist
      operationId: getArtistNote
      responses:
        "200":
          description: Artist note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArtistNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Notes]
      summary: Create a personal note about an artist
      operationId: createArtistNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserArtistNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Note already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Notes]
      summary: Update a personal note about an artist
      operationId: updateArtistNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "204":
          description: Note updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Notes]
      summary: Delete a personal note about an artist
      operationId: deleteArtistNote
      responses:
        "204":
          description: Note deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Artist note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/me/notes/releases/{releaseID}:
    parameters:
      - $ref: "#/components/parameters/ReleaseID"
    get:
      tags: [Notes]
      summary: Get a personal note about a release
      operationId: getReleaseNote
      responses:
        "200":
          description: Release note
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserReleaseNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Notes]
      summary: Create a personal note about a release
      operationId: createReleaseNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "201":
          description: Note created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserReleaseNote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Note already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Notes]
      summary: Update a personal note about a release
      operationId: updateReleaseNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "204":
          description: Note updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Notes]
      summary: Delete a personal note about a release
      operationId: deleteReleaseNote
      responses:
        "204":
          description: Note deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Release note not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token returned by POST /api/v1/auth/login.
        Use the token in the Authorization header:
        Bearer <access_token>

  parameters:
    PathID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    ArtistID:
      name: artistID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    ReleaseID:
      name: releaseID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    ReleaseArtistID:
      name: artist_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Unauthorized:
      description: Authentication is required or the access token is invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid request body

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, ready, not_ready]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
          pattern: "^[a-zA-Z0-9_]{3,32}$"
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Password length is validated in bytes by the server.

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: Signed JWT access token
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Token lifetime in seconds
          example: 86400

    User:
      type: object
      required: [id, username, email, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ArtistRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        normalized_name:
          type: string
          description: Defaults to the lowercase artist name when omitted or empty.
        sort_name:
          type: [string, "null"]
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
          format: uri

    Artist:
      type: object
      required:
        - id
        - name
        - normalized_name
        - sort_name
        - description
        - image_url
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        normalized_name:
          type: string
        sort_name:
          type: [string, "null"]
        description:
          type: [string, "null"]
        image_url:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReleaseCreateRequest:
      type: object
      additionalProperties: false
      required: [title, release_type, artists]
      properties:
        title:
          type: string
          minLength: 1
        release_type:
          $ref: "#/components/schemas/ReleaseType"
        release_date:
          type: [string, "null"]
          format: date
        description:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]
        artists:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ReleaseArtistCreateRequest"
          description: Must contain at least one primary artist.

    ReleaseUpdateRequest:
      type: object
      additionalProperties: false
      required: [title, release_type]
      properties:
        title:
          type: string
          minLength: 1
        release_type:
          $ref: "#/components/schemas/ReleaseType"
        release_date:
          type: [string, "null"]
          format: date
        description:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]

    ReleaseType:
      type: string
      enum:
        - album
        - ep
        - single
        - compilation
        - mixtape
        - live
        - other

    Release:
      type: object
      required:
        - id
        - title
        - release_type
        - release_date
        - description
        - cover_url
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        release_type:
          $ref: "#/components/schemas/ReleaseType"
        release_date:
          type: [string, "null"]
          format: date
        description:
          type: [string, "null"]
        cover_url:
          type: [string, "null"]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReleaseWithArtists:
      allOf:
        - $ref: "#/components/schemas/Release"
        - type: object
          required: [artists]
          properties:
            artists:
              type: array
              items:
                $ref: "#/components/schemas/ReleaseArtist"

    ReleaseArtistCreateRequest:
      type: object
      additionalProperties: false
      required: [artist_id]
      properties:
        artist_id:
          type: integer
          format: int64
          minimum: 1
        role:
          type: string
          enum: [primary, featured, producer]
          default: primary
        position:
          type: integer
          minimum: 0

    ReleaseArtistUpdateRequest:
      type: object
      additionalProperties: false
      required: [role, position]
      properties:
        role:
          type: string
          enum: [primary, featured, producer]
        position:
          type: integer
          minimum: 0

    ReleaseArtist:
      type: object
      required: [id, name, normalized_name, sort_name, role, position]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        normalized_name:
          type: string
        sort_name:
          type: [string, "null"]
        role:
          type: string
          enum: [primary, featured, producer]
        position:
          type: integer
          format: int32

    RatingRequest:
      type: object
      additionalProperties: false
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 10

    RatingStats:
      type: object
      required: [average_rating, ratings_count]
      properties:
        average_rating:
          type: number
          format: double
          example: 8.75
        ratings_count:
          type: integer
          format: int64
          example: 120

    UserArtistRating:
      type: object
      required: [user_id, artist_id, rating, created_at, updated_at]
      properties:
        user_id:
          type: integer
          format: int64
        artist_id:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 10
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserReleaseRating:
      type: object
      required: [user_id, release_id, rating, created_at, updated_at]
      properties:
        user_id:
          type: integer
          format: int64
        release_id:
          type: integer
          format: int64
        rating:
          type: integer
          minimum: 1
          maximum: 10
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LibraryArtist:
      type: object
      required: [id, name, sort_name, added_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        sort_name:
          type: [string, "null"]
        added_at:
          type: string
          format: date-time

    LibraryRelease:
      type: object
      required: [id, title, release_type, release_date, cover_url, added_at]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        release_type:
          $ref: "#/components/schemas/ReleaseType"
        release_date:
          type: [string, "null"]
          format: date
        cover_url:
          type: [string, "null"]
        added_at:
          type: string
          format: date-time

    NoteRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000

    UserArtistNote:
      type: object
      required: [user_id, artist_id, content, created_at, updated_at]
      properties:
        user_id:
          type: integer
          format: int64
        artist_id:
          type: integer
          format: int64
        content:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    UserReleaseNote:
      type: object
      required: [user_id, release_id, content, created_at, updated_at]
      properties:
        user_id:
          type: integer
          format: int64
        release_id:
          type: integer
          format: int64
        content:
          type: string
          maxLength: 5000
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
